<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <h1 class="page-title" th:text="${calendarYear + '年' + calendarMonth + '月'}">2026年4月</h1>

        <div class="calendar-nav">
            <div class="calendar-nav-left">
                <a class="btn sub" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
                <a class="btn sub" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
            </div>
            <div class="calendar-nav-right">
                <a class="btn sub" href="/todos">表で見る</a>
                <a class="btn sub" href="/todos/new">新規登録</a>
            </div>
        </div>

        <table class="calendar-table"
               th:attr="data-from=${calendarFrom},data-to=${calendarTo}">
            <thead>
                <tr>
                    <th>日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th>土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${calendarWeeks}">
                    <th:block th:each="day : ${week}">
                        <td class="calendar-day"
                            th:if="${day != null}"
                            th:attr="data-date=${day}"
                            th:text="${day.dayOfMonth}">1</td>
                        <td class="calendar-day is-empty" th:unless="${day != null}"></td>
                    </th:block>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const calendarTable = document.querySelector('.calendar-table');
        const from = calendarTable.dataset.from;
        const to = calendarTable.dataset.to;

        async function loadTodos() {
            const res = await fetch(`/api/todos?from=${from}&to=${to}`);
            const todos = await res.json();
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const dateCells = document.querySelectorAll('[data-date]');
            for (const dateCell of dateCells) {
                const date = dateCell.dataset.date;
                const matchingTodos = todos.filter(todo => todo.dueDate === date);
                for (const todo of matchingTodos.slice(0, 3)) {
                    const title = document.createElement('a');
                    title.href = `/todos/${todo.id}/edit`;
                    title.className = 'calendar-todo-link';
                    title.textContent = todo.title;
                    if (todo.dueDate < today && todo.completed === false) {
                        title.classList.add('is-overdue');
                    }
                    dateCell.appendChild(title);
                }

                const remainingCount = matchingTodos.length - 3;
                if (remainingCount > 0) {
                    const remaining = document.createElement('div');
                    remaining.textContent = `ほか ${remainingCount}件`;
                    dateCell.appendChild(remaining);
                }
            }
        }

        async function loadHolidays() {
            const res = await fetch(`/api/holidays?from=${from}&to=${to}`);
            const holidays = await res.json();

            if (res.headers.get('X-Holidays-Unavailable') === 'true') {
                const message = document.createElement('p');
                message.className = 'flash';
                message.textContent = '祝日を取れませんでした';
                calendarTable.parentElement.insertBefore(message, calendarTable);
            }

            const dateCells = document.querySelectorAll('[data-date]');
            for (const dateCell of dateCells) {
                const date = dateCell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

                if (dayOfWeek === 0) {
                    dateCell.classList.add('is-sunday');
                } else if (dayOfWeek === 6) {
                    dateCell.classList.add('is-saturday');
                }

                if (Object.prototype.hasOwnProperty.call(holidays, date)) {
                    dateCell.classList.add('is-holiday');
                    dateCell.title = holidays[date];
                }
            }
        }

        loadTodos();
        loadHolidays();
    </script>
</body>

</html>
